<section class="music-player">
    <button id="musicToggle" class="music-toggle" type="button">
        <span id="musicIcon">▶</span>
        <span id="musicText">Ouvir nossa música</span>
    </button>

    <iframe id="youtubePlayer" src="https://www.youtube.com/embed/SFiu3KLNd34?enablejsapi=1&playsinline=1"
        title="Música do casamento" allow="autoplay; encrypted-media" frameborder="0">
    </iframe>
</section>

<script>
    let player;
    let tocando = false;
    let playerPronto = false;

    // Criado automaticamente pela API do YouTube
    function onYouTubeIframeAPIReady() {

        player = new YT.Player('youtubePlayer', {
            events: {
                'onReady': function () {
                    playerPronto = true;
                },

                'onStateChange': function (event) {

                    const icon = document.getElementById('musicIcon');
                    const text = document.getElementById('musicText');

                    if (event.data === YT.PlayerState.PLAYING) {
                        tocando = true;
                        icon.textContent = '❚❚';
                        text.textContent = 'Pausar música';
                    }

                    if (
                        event.data === YT.PlayerState.PAUSED ||
                        event.data === YT.PlayerState.ENDED
                    ) {
                        tocando = false;
                        icon.textContent = '▶';
                        text.textContent = 'Ouvir nossa música';
                    }
                }
            }
        });
    }

    document.getElementById('musicToggle').addEventListener('click', function () {

        if (!playerPronto) {
            return;
        }

        if (tocando) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
    });
</script>

<script src="https://www.youtube.com/iframe_api"></script>
